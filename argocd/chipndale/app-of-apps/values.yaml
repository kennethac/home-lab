global:
  repoURL: https://github.com/kennethac/home-lab.git
  targetRevision: HEAD
  destinationServer: https://kubernetes.default.svc

# List every child application you want to generate
applications:
  - name: cilium-setup
    path: argocd/chipndale/apps/cilium-setup
    namespace: cilium
    syncWave: "0"
  - name: proxmox-csi
    chart: proxmox-csi-plugin
    repoURL: ghcr.io/sergelogvinov/charts
    targetRevision: 0.5.10
    namespace: csi-proxmox
    syncWave: "0"
    helm:
      values: |
        config:
          existingConfigSecret: proxmox-csi-plugin
        storageClass:
          - name: proxmox-data-ext4
            storage: local-lvm # Proxmox storage pool name
            reclaimPolicy: Delete
            fstype: ext4
            default: true
  - name: external-dns
    chart: external-dns
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    targetRevision: 1.22.0
    namespace: kube-system
    syncWave: "1"
    helm:
      values: |
        provider:
          name: rfc2136
        domainFilters:
          - "kenneth.ac"
          - "kennethchristensen.me"
          - "exultantsoftware.com"
        # Pass multiple zone flags via extraArgs
        extraArgs:
          - --rfc2136-zone=kenneth.ac
          - --rfc2136-zone=kennethchristensen.me
          - --rfc2136-zone=exultantsoftware.com
        env:
          - name: EXTERNAL_DNS_RFC2136_HOST
            value: "192.168.85.18"
          - name: EXTERNAL_DNS_RFC2136_PORT
            value: "53"
          - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
            valueFrom:
              secretKeyRef:
                name: technitium-tsig-secret
                key: tsig-secret
          - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET_ALG
            value: "hmac-sha256"
          - name: EXTERNAL_DNS_RFC2136_TSIG_KEYNAME
            value: "default-tsig-key"
          - name: EXTERNAL_DNS_RFC2136_TSIG_AXFR
            value: "true"
        sources:
          - service
          - ingress
        policy: sync
        txtOwnerId: "chipndale-cluster"
  - name: tailscale-operator
    chart: tailscale-operator
    repoURL: https://pkgs.tailscale.com/helmcharts
    targetRevision: 1.102.3
    namespace: tailscale
    syncWave: "0"
    helm:
      values: |
        operatorConfig:
          hostname: chipndale-operator
  - name: httpbin-test
    path: argocd/chipndale/apps/httpbin-test
    namespace: playground
    syncWave: "2"
  - name: home-statics
    path: argocd/chipndale/apps/home-statics
    namespace: statics
    syncWave: "2"
  - name: cert-manager
    chart: cert-manager
    repoURL: https://charts.jetstack.io
    targetRevision: v1.21.2
    namespace: cert-manager
    syncWave: "0"
    helm:
      values: |
        crds:
          enabled: true
  - name: cert-manager-certs
    path: argocd/chipndale/apps/cert-manager
    namespace: cert-manager
    syncWave: "1"
  - name: mealie-app
    path: argocd/chipndale/apps/mealie
    namespace: playground
    syncWave: "2"
  - name: pihole
    path: argocd/chipndale/apps/pihole
    namespace: pihole
    syncWave: "1"