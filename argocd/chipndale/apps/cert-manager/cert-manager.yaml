---
# ClusterIssuer using Cloudflare DNS-01 ACME Challenge
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-cloudflare
spec:
  acme:
    email: admin@kennethchristensen.me
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-cloudflare-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
---
# Wildcard Certificate for *.kenneth.ac
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kenneth-ac-wildcard
  namespace: statics
spec:
  secretName: kenneth-ac-wildcard-tls
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - "*.kenneth.ac"